<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Last.fm Dashboard</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>

<body>
    <h1>Last.fm Dashboard</h1>

    <div id="toolbar">
        <input type="text" id="searched-user" placeholder="Search for a user...">
        <button id="search-button">Search</button>
    </div>

    <div id="avatar" class="hidden">
        <img id="avatar-image" src="" alt="User Avatar">
        <div id="user-info">
            <p id="username"></p>
            <p id="playcount"></p>

        </div>
    </div>

    <div id="filterbar">
        <button class="filter-button" data-filter="gettopartists">Top Artists</button>
        <button class="filter-button active" data-filter="gettopalbums">Top Albums</button>
        <button class="filter-button" data-filter="gettoptracks">Top Tracks</button>
    </div>



    <div id="results"></div>

    <div id="popover" class="hidden">
        <button id="popover-close" aria-label="Close">&times;</button>
        <h3 id="popover-title"></h3>
        <p id="popover-subtitle" class="hidden"></p>
        <p id="popover-year" class="hidden"></p>
        <div id="popover-stats"></div>
        <div id="popover-tags"></div>
    </div>
</body>

<script src="script.js"></script>

</html>
